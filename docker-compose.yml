services:
  app:
    build:
      context: .
    image: sajin-php-app
    container_name: sajin-php_app
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
      - mysql_socket:/var/run/mysqld
    networks:
      - sajin_network
    environment:
      - PHP_OPCACHE_ENABLE=1
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DEFAULT_URL=${DEFAULT_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25
    container_name: sajin-nginx_server
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    networks:
      - sajin_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0.32
    container_name: sajin-mysql_db
    ports:
      # 로컬 MySQL과 충돌 방지를 위해 3307 포트 사용 (127.0.0.1 제한)
      - "127.0.0.1:3307:3306"
    networks:
      - sajin_network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
    healthcheck:
      # DB가 완전히 준비된 후 앱 컨테이너를 실행하기 위한 체크
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: sajin-redis_server
    ports:
      # 로컬 Redis와 충돌 방지를 위해 별도 포트 사용 (127.0.0.1 제한)
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - sajin_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  sajin_network:
    driver: bridge

volumes:
  mysql_data:
  mysql_socket:
